---
layout: page
---

<section class="section">
  <div class="container">
    {% if page.image %}
      <img src="{{ page.image | relative_url }}" alt="{{ page.title }}" class="imagen-ancha">
    {% endif %}

    <h1 class="titulo-diseno">{{ page.title }}</h1>

    {% if page.subtitle %}
      <p class="flow-text center-align" style="margin-bottom:1.2rem;">
        {{ page.subtitle }}
      </p>
    {% endif %}

    {% if page.doc_url %}
      <p class="center-align" style="margin: 0 0 2rem;">
        <a class="btn btn-verde waves-effect waves-light"
           href="{{ page.doc_url | relative_url }}"
           >
          <i class="material-icons left">file_download</i>
          {{ page.doc_label | default: "Ficha del diseño (PDF)" }}
        </a>
      </p>
    {% endif %}

    <div class="content">
      {{ content }}
    </div>
  </div>
</section>
