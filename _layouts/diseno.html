---
layout: page
show_hero: false
---

<section class="section diseno">
  {% if page.image %}
    <img src="{{ page.image | relative_url }}"
         alt="{{ page.title }}"
         class="imagen-ancha">
  {% endif %}

  <div class="container">
    <h1 class="diseno-title">{{ page.title }}</h1>
    {% if page.subtitle %}
      <p class="diseno-subtitle">{{ page.subtitle }}</p>
    {% endif %}

    {% assign subject = 'Solicitud diseño: ' | append: page.title %}
    <a class="btn" href="{{ '/contact/' | relative_url }}?subject={{ subject | uri_escape }}">
      Contactar por este diseño
    </a>

    <div class="content">
      {{ content }}
    </div>
  </div>
</section>
