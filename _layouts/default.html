<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      {% if page.title %}
        {{ page.title | escape }}
      {% else %}
        {{ site.title | escape }}
      {% endif %}
    </title>

    {% seo title=false %}

    <!-- ICONOS / FAVICON -->
    <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png?v=1' | relative_url }}">
    <link rel="apple-touch-icon" href="{{ '/assets/img/favicon.png?v=1' | relative_url }}">
    <link rel="shortcut icon" href="{{ '/assets/img/favicon.png?v=1' | relative_url }}">

    <!-- FUENTES + ICONOS -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="//fonts.googleapis.com/icon?family=Material+Icons">

    <!-- CSS BASE -->
    <link rel="stylesheet" href="//cdnjs.cloudflare.com/ajax/libs/materialize/0.99.0/css/materialize.min.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/sidebar.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/footer.css">

    <!-- CSS DEL LAYOUT Y DE LA PÁGINA -->
    {% for css in layout.css %}
      {% if css contains "//" %}
        <link rel="stylesheet" href="{{ css }}">
      {% else %}
        <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/{{ css }}">
      {% endif %}
    {% endfor %}
    {% for css in page.css %}
      {% if css contains "//" %}
        <link rel="stylesheet" href="{{ css }}">
      {% else %}
        <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/{{ css }}">
      {% endif %}
    {% endfor %}
  </head>

  <body>

    
    {% include header.html %}

    <!-- ÚNICO MAIN -->
    <main id="main-content" role="main">
      {{ content }}
    </main>

    

    <!-- SCRIPTS GLOBALES (solo los necesarios) -->
    <script src="{{ '/assets/js/shrink-logo.js' | relative_url }}" defer></script>
    <script>
      // Toggle del menú solo en móvil (clase .open)
      document.addEventListener('DOMContentLoaded', function(){
        var btn = document.getElementById('menu-toggle');
        var sidenav = document.getElementById('side-nav');
        if (btn && sidenav){
          btn.addEventListener('click', function(){
            sidenav.classList.toggle('open');
          });
        }
        // Kill-switch por si quedó alguna clase del experimento:
        document.body.classList.remove('nav-docked');
      });
    </script>




<script>
/* Encoge el bloque del logo y el logo verde; el verde se desvanece.
   Usa mínimos configurables por CSS vars y easing para que no se quede tan pequeño. */
(function () {
  function init() {
    const block =
      document.querySelector('#side-nav .userView') ||
      document.querySelector('.sidenav .userView') ||
      document.querySelector('.side-nav .userView');
    if (!block) return;

    const fg   = block.querySelector('.logo-fg'); // verde (delante)
    const bg   = block.querySelector('.logo-bg'); // blanco (detrás) opcional
    const root = document.documentElement;

    // Lee mínimos desde CSS
    let maxH   = parseInt(getComputedStyle(root).getPropertyValue('--logo-max-h')) || 265;
    const minH = parseInt(getComputedStyle(root).getPropertyValue('--logo-min-h')) || 230;
    const minS = parseFloat(getComputedStyle(root).getPropertyValue('--logo-min-scale')) || 0.85;

    // Usa el alto real renderizado como máximo si difiere
    const realH = block.getBoundingClientRect().height;
    if (!isNaN(realH) && realH > 0) maxH = realH;

    const mq    = window.matchMedia('(min-width: 993px)');
    const range = 110;   // píxeles de scroll para llegar al mínimo (sube/baja para ajustar)

    // curva ease-out para que el final sea más suave y no encoja tanto
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

    function update() {
      if (!mq.matches) {
        block.style.setProperty('min-height', '0px', 'important');
        block.style.setProperty('height', 'var(--logo-max-h)', 'important');
        if (fg) { fg.style.transform = 'scale(1)'; fg.style.opacity = '1'; }
        if (bg) { bg.style.transform = 'scale(1)'; }
        return;
      }

      const y     = window.scrollY;
      const tRaw  = Math.min(y / range, 1);          // 0 → 1 lineal
      const t     = easeOutCubic(tRaw);              // suavizado
      const h     = Math.round(maxH - (maxH - minH) * t);
      const s     = 1 - (1 - minS) * t;              // 1 → minS
      const o     = 1 - Math.min(tRaw / 0.9, 1);     // opacidad verde: 1 → 0 (se apaga antes del final)

      block.style.setProperty('min-height', '0px', 'important');
      block.style.setProperty('height', h + 'px', 'important');

      if (fg) { fg.style.transform = `scale(${s})`; fg.style.opacity = o.toFixed(3); }
      if (bg) { bg.style.transform = `scale(${s})`; }
    }

    let ticking = false;
    window.addEventListener('scroll', () => {
      if (!ticking) {
        requestAnimationFrame(() => { update(); ticking = false; });
        ticking = true;
      }
    }, { passive: true });

    window.addEventListener('resize', update);
    update();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>


  </body>
</html>
