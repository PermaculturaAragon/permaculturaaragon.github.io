# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Permacultura Aragón
description: > # this means to ignore newlines until "baseurl:"
  Web de Permacultura Aragón, asociación sin ánimo de lucro.
url: "https://permaculturaAragon.github.io"
baseurl: ""
permalink: /:year/:month/:day/:title
repository: ShawnTeoh/matjek
paginate: 5

# MatJek specific configurations
github_profile: "https://github.com/ShawnTeoh"
user: "Permacultura Aragón"
user_email: "permaculturaaragon@gmail.com"
contact_url: "https://forms.gle/XLspcRAoBTXQtVCe6"
google_tracking_id: "UA-96359860-1"
google_site_verification: "UA-96359860-1"
disqus_shortname: "matjek"

formspree_endpoint: "https://formspree.io/f/xkgqevqe"

favicon: "../assets/res/favicon.png"

# Build settings
markdown: kramdown
gems:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
sass:
  style: compressed
future: true

# --- Colecciones ---
collections:
  disenos:
    output: true
    permalink: /disenos/:name/
  iniciativas:
    output: true
    permalink: /iniciativas/:name/

# Valores por defecto (opcional, pero recomendado)
defaults:
  - scope:
      path: ""
      type: "disenos"
    values:
      layout: diseno
      subtitle: ""
      image: ""
      order: 1

  - scope:
      path: ""
      type: "iniciativas"
    values:
      layout: iniciativa
      subtitle: ""
      logo: ""
      link: ""
      website: ""
      description: ""
      image1: ""
      image2: ""
      order: 1




social:
  instagram: https://instagram.com/permacultura.aragon
  facebook:  https://www.facebook.com/permaculturaaragon
  youtube:   https://www.youtube.com/@permaculturaaragon7075

